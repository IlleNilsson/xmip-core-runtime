# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-runtime"
description = "The Xmip runtime: module registry, host service planning and the startup execution tree."

[lib]
path = "src/lib.rs"
# rlib for the estate, cdylib for the surfaces. ADR-0014: the xmip executable,
# the PowerShell module and the GUI are .NET and P/Invoke a C ABI, so there
# has to be a native library that exports xmip_operate_v1 for them to load.
# This is it.
crate-type = ["rlib", "cdylib"]

[lints.rust]
# deny, not forbid, since 2026-09-04. Eight files allow it at the top with
# their reason, and nothing else may. operate.rs implements the C table in
# xmip_operate.h, start.rs exports xmip_start_v1 and xmip_validate_v1,
# rule.rs and rule/node.rs forward the section 7 rules, and publication.rs
# and curve.rs read a publication and a curve for section 8; all six read or
# write through pointers a surface handed them (ADR-0027, the boundary
# facing out).
# loaded_module.rs and loaded_contract.rs open somebody else's library and
# call through its table (ADR-0012, the boundary facing in) — the loader
# ADR-0057 clause 8 step 2 asks for, and the only two files in the crate that
# cross inward.
unsafe_code = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Optional: only a node that loads modules links a loader, and only the
# dynamic-loading feature turns it on. The portable dlopen/LoadLibraryEx pair,
# nothing more — the flags specification section 3 requires are passed by
# loaded_module.rs, which does not take the crate's defaults on Windows.
libloading = { version = "0.8", optional = true }
abi = { package = "xmip-core-abi", git = "https://github.com/IlleNilsson/xmip-core-abi", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
journey = { package = "xmip-core-journey", git = "https://github.com/IlleNilsson/xmip-core-journey", branch = "main" }
node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main" }
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
party = { package = "xmip-core-party", git = "https://github.com/IlleNilsson/xmip-core-party", branch = "main" }
receive = { package = "xmip-core-receive", git = "https://github.com/IlleNilsson/xmip-core-receive", branch = "main" }
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
send = { package = "xmip-core-send", git = "https://github.com/IlleNilsson/xmip-core-send", branch = "main" }
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main" }
route = { package = "xmip-core-route", git = "https://github.com/IlleNilsson/xmip-core-route", branch = "main" }
observe = { package = "xmip-core-observe", git = "https://github.com/IlleNilsson/xmip-core-observe", branch = "main" }
configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main" }
# The one byte cursor a loaded contract reads the content through.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[features]
# host.rs, loaded_module.rs and loaded_contract.rs are guarded on this.
# Declared so the cfg is a real switch rather than a condition that is
# silently always false.
dynamic-loading = ["dep:libloading"]
