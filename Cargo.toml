[package]
name = "xmip-core-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-runtime"
description = "The Xmip runtime: a node started from its configuration and the technologies its program links, the message path it runs, and the operate plane's two ends."

[lib]
path = "src/lib.rs"
# An rlib alone: the native library the surfaces load, exporting
# xmip_operate.h over this crate, is xmip-core-operate's (ADR-0058, amendment
# 2026-11-16).
crate-type = ["rlib"]

[lints.rust]
# deny, not forbid, because forbid cannot be lowered anywhere. The runtime's
# C boundary is one folder, src/ffi/ (ADR-0050, refined 2026-09-25): the
# loader that opens somebody else's library and calls through its table
# (ADR-0057, the boundary facing in) and the calls a directory watch makes.
# The boundary facing out, xmip_operate.h, is xmip-core-operate's (ADR-0050,
# amendment 2026-11-16). Each file there allows unsafe at its top with its
# reason; nothing outside the folder may, and test/Unsafe.Test.ps1 holds it.
unsafe_code = "deny"

# What a remote surface needs — `node`, `observe`, `net`, `tls`,
# `serde_json` and the local endpoint's connecting end — is always linked; every
# dependency marked optional is the running node's, and only the `node`
# feature turns it on (see [features]).
[dependencies]
serde ={ version = "1", features = ["derive"], optional = true }
# The operate plane's calls and answers, and the catalogue and the Reports a
# surface is handed, as JSON, in memory only (ADR-0031 clause 2).
serde_json = "1"
# Optional: only a node that loads modules, or a surface's library that
# probes one, links a loader, and only the loader feature turns it on. The portable dlopen/LoadLibraryEx pair,
# nothing more — the flags specification section 3 requires are passed by
# ffi/loaded_module.rs, which does not take the crate's defaults on Windows.
libloading = { version = "0.9", optional = true }
# A module's manifest and the table a loaded module is called through
# (`xmip_module.h`).
abi = { workspace = true, optional = true }
xcore = { workspace = true }
context = { workspace = true, optional = true }
journey = { workspace = true, optional = true }
node = { workspace = true }
message = { workspace = true, optional = true }
stream = { workspace = true, optional = true }
party = { workspace = true, optional = true }
receive = { workspace = true, optional = true }
identify = { workspace = true, optional = true }
# x509: who a surface is, the subject of the certificate it presented to
# the operate listener, read by the one reader of a name (plane::served).
authenticate = { workspace = true, features = ["x509"], optional = true }
send = { workspace = true, optional = true }
authorize = { workspace = true, optional = true }
route = { workspace = true, optional = true }
# What a node audits, through the capability that owns it (ADR-0062).
# xaudit, as xcore, because xmip-core-operate's export of it is
# ffi/audit.rs.
xaudit = { workspace = true, optional = true }
# Section 11: Events, subscribed from any language: the Event and its
# filter are the event crate's (ADR-0065). xevent, as xaudit, because the
# export's own file is ffi/event.rs.
xevent = { workspace = true, optional = true }
observe = { workspace = true }
# Who a cluster's members are, `xcluster::Membership`, which the operate
# plane's gatherer is handed (`plane::gather`; ADR-0052, amendment
# 2026-11-13). xcluster, because `plane::gather` speaks of a cluster. Its
# `delivery`, the process's hub section 11 forwards to, comes with `node`
# (ADR-0065, amendment 2026-11-13); a remote build links no hub.
xcluster = { workspace = true, default-features = false }
configure = { workspace = true, optional = true }
# Section 25: every Report in one list, and a Quest probing a node's
# configuration the runtime composes (ADR-0072, amendment 2026-11-10). The
# list and its answers are the capability's; the runtime hands in the
# installation and the audit each Quest's last probe is read from.
report = { workspace = true, optional = true }
# A Work Process: its compiled program, its engine and its unit; and BPMN
# 2.0, the default design format the designer reads and compiles
# (ADR-0066, amendment 2026-10-22).
assign = { workspace = true, optional = true }
process = { workspace = true, optional = true }
# The one transport trait: every Location's transport is built through it,
# once, from the technologies the program starting the node linked, and
# handed the guard the node terminates its receives' TLS with
# (`transport::Guard`, from `[provision.receive]`).
transport = { workspace = true, features = ["tls"], optional = true }
# When: how long a Receive Location rests before it asks its transport
# again, and when a Send Port queue's earliest retry is due. Decided there,
# waited for here (ADR-0058, amendment 2026-11-13).
schedule = { workspace = true, optional = true }
# Whether and when a Send Port's failed try is tried again: its guards
# decide, asked after each try (ADR-0048, amendment 2026-11-14). The
# capability alone; the retry guard a Port's `retry` is built as is the
# program's to link and hand in (`linked::Linked::retry`).
resilience = { workspace = true, optional = true }
# The runtime store: where a paused Subscription's standing and the Messages
# it holds are kept, sealed, over whichever engine the program linked, so a
# pause survives a restart (ADR-0013, amendment 2026-09-30).
persist = { workspace = true, optional = true }
# The key home the runtime store's data key is wrapped in: the key store the
# node's `[store]` names, among those its program linked (ADR-0063 clause 4).
secret = { workspace = true, optional = true }
# The operate plane (ADR-0067; ADR-0014, amendment 2026-10-12): gRPC on
# the estate's own HTTP/2 and framing, inside Xmip's own mutual TLS; and
# the local endpoint's named pipe on Windows (`net::pipe`).
net = { workspace = true }
tls = { workspace = true }
# A person's certificate (ADR-0034, amendment 2026-10-15), signed on a node
# by the authority `[provision.operator]` names, and a node's own. The
# capability alone; the runtime links no technology of it.
provision = { workspace = true, optional = true }
# A test authority and each end's certificate, for the operate plane's
# tests (`fixture::authority`): only the test-support feature turns it on.
rcgen = { version = "0.14", optional = true }
# A test's Subscription written as the expression its filter is
# (`fixture::subscription`): only the test-support feature turns it on.
expression = { workspace = true, optional = true }
# The test authority's own temporary folder (`fixture::authority`,
# `file::temporary`): only the test-support feature turns it on.
file = { workspace = true, optional = true }
# The one byte cursor a loaded contract reads the content through, the
# percent-encoding of a call's refusal, and the wide string a directory
# watch names its directory to Windows by (`codec::wide`).
codec = { workspace = true, optional = true }

# A directory watch (`directory_watch`): a change notification and the
# event that ends its wait. The local operate endpoint's pipe on Windows is
# `net::pipe`'s (ADR-0014, amendment 2026-10-21).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"], optional = true }
# A program under the Windows Service Control Manager
# (`registration::control_manager`): the dispatcher, the control handler a
# Stop or a Shutdown arrives on, and the status it reports, for every program
# the estate runs as a service.
windows-service = { version = "0.8", optional = true }

# On Unix a Unix domain socket: the connecting user by the kernel's word,
# its name, and the group a shared socket belongs to. Only the node's side
# asks who connected, so only `node`
# links it; a remote build connects with the standard library alone, and
# the phone's (iOS) never compiles `nix`'s socket module, which names
# macOS-only constants on every Apple target. A directory watch
# (`directory_watch`) waits on inotify on Linux and kqueue elsewhere,
# through `nix`'s safe calls.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket", "user", "inotify", "event", "poll"], optional = true }

[dev-dependencies]
# This crate with its `test-support`, so the integration tests (tests/) take
# the same fixtures its unit tests do. Without the default features, so a
# remote build's tests stay a remote build (`--no-default-features
# --features remote`).
xmip-core-runtime = { path = ".", default-features = false, features = ["test-support"] }
# The latency tests' figures, the plain wake they are held beside and Xmip's
# own processor time (`xcore::latency`, `xcore::processor_time`).
xcore = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { workspace = true, features = ["test-support"] }
# A loopback address no one holds, for a node a test starts to bind
# (`net::fixture::unheld`).
net = { workspace = true, features = ["test-support"] }
# A record's one binary form (`codec::form::Form`), which a test of the
# audit chain writes a changed record back in; and the wide string a test of
# a pinned library names it to Windows by (`codec::wide`).
codec = { workspace = true }
# A runtime store in memory, sealed under a key held in memory, so a test
# stops and starts a node over the same records without a machine's key store.
persist = { workspace = true, features = ["test-support"] }
secret = { workspace = true, features = ["test-support"] }
# Chains with an intermediate of their own validity, so a test proves a
# relayed caller ends where any certificate of its path ends.
authenticate = { workspace = true, features = ["x509", "mint"] }
# One real route technology, so a test proves arrival reads a prefixed
# property through what a node loads rather than through a stand-in.
# A Work Process the tests run is drawn in BPMN 2.0 and compiled here.
process-bpmn = { workspace = true }
route-party = { workspace = true }
# The retry guard, handed to a test's node as a program hands it
# (`linked::Linked::retry`), so a Send Port's `retry` is judged as
# xmip-service judges it.
retry = { workspace = true }
# The sink a test hands its audit, as a program hands it, read back from
# the file: the file technology of the audit capability.
audit-file = { workspace = true }
# The tests write a Subscription's filter as the expression it is (ADR-0066).
expression = { workspace = true }
# One real transport with a loopback far end, so a test starts a node that
# receives and sends over it rather than over a stand-in; with TLS, so a
# test proves a Party's certificate through a node's real gates.
tcp = { workspace = true, features = ["tls"] }
# And one whose connections are kept, for a test that carries hundreds of
# Messages through a node: raw TCP spends a connection a Message, its
# sender's side waiting minutes to close (ADR-0018, amendment 2026-10-21).
http = { workspace = true }
# And a serial line on a bench port in place of a device (`serial::bench`),
# so a test proves the node hands every Location what its Locations share:
# two naming one device go through its one port (ADR-0064, amendment
# 2026-11-15).
serial = { workspace = true, features = ["test-support"] }
# The test Storage node (the owner, 2026-10-01: *for testing purposes the
# Xmip Nodes of Storage type can use SQLite in memory for administration and
# RocksDB for runtime*), so the receive path is proved, timed and killed
# over the engines a node keeps the Ledger in.
rocksdb = { workspace = true }
sqlite = { workspace = true }

# The platform's key store, so a test that kills a process holding the
# Ledger reopens it under the same data key (ADR-0063 clause 4).
[target.'cfg(windows)'.dev-dependencies]
secret-dpapi = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
secret-file = { workspace = true }

[features]
# A node and every surface on a machine that runs one.
default = ["node"]
# The running node: its start and its message path (`running`, `arrival`,
# `send_step`, the Ledger, Xmip Storage), the service and its registration,
# the runtime store (`persist`) and its key home (`secret`), the transports
# a program links, and the node's side of the operate plane — the operate
# listener and its board (`plane::listener`, `plane::served`) — with what
# xmip-core-operate's node build exports over it: a person's request signed
# by the authority `[provision.operator]` names (`operator_certificate`), a
# host's listener in Xmip's own protection and the certificate an authority
# issues it (`secure_listener`), and every Report listed and a Quest probing
# a node's configuration (`report`, over `report`). Everything a remote
# surface has, too.
node = [
    "remote",
    "dep:abi",
    "dep:xaudit",
    "dep:provision",
    "dep:windows-sys",
    "dep:windows-service",
    "dep:serde",
    "dep:context",
    "dep:journey",
    "dep:message",
    "dep:stream",
    "dep:party",
    "dep:receive",
    "dep:identify",
    "dep:authenticate",
    "dep:send",
    "dep:authorize",
    "dep:route",
    "dep:xevent",
    "xcluster/delivery",
    "dep:configure",
    "dep:report",
    "dep:codec",
    "dep:process",
    "dep:assign",
    "dep:transport",
    "dep:schedule",
    "dep:resilience",
    "dep:persist",
    "dep:secret",
    "dep:nix",
]
# A surface that follows nodes on other machines and runs none, the phone
# (ADR-0014, amendment 2026-10-14): `plane::remote` and the operate plane's
# call, local endpoint and role it stands on, which xmip-core-operate's
# remote build exports, and a refusal's message percent-encoded on the call
# (`codec::percent`), with the authenticated identity the gate's role check
# takes (`context::AuthenticatedIdentity`). Built alone with
# `--no-default-features --features remote`.
remote = ["dep:codec", "dep:authorize", "dep:context"]
# The host opening a module's library, `ffi/loaded_module.rs`, and the one
# probe of what a library declares, `ffi/probed.rs`, which
# xmip-core-operate exports as `xmip_module_probe_v1` (ADR-0012, amendment
# 2026-11-17): a surface's library probes and runs no module.
loader = ["dep:abi", "dep:libloading"]
# ffi/loaded_contract.rs, ffi/loaded_work_process.rs, ffi/loaded_promotion.rs,
# the table lifecycle they share (ffi/lifecycle.rs) and what library.rs
# opens with them are guarded on this: a node that opens what its
# configuration starts. Declared so the cfg is a real switch rather than a
# condition that is silently always false.
dynamic-loading = ["node", "loader"]
# The gates' stand-ins the runtime's tests run a node with (`fixture`),
# placed once for its unit tests, its integration tests and
# xmip-core-operate's, with Xmip Storage in memory (`ledger::in_memory`).
# Enabled only by a dev-dependency on this crate, so never in a production
# build. It names its nodes from the test cluster's `cluster.xmip`
# (`configure::fixture`), and its authority keeps its directory in a test's
# own temporary folder (`file::temporary`).
test-support = [
    "configure?/test-support",
    "persist?/test-support",
    "secret?/test-support",
    "dep:file",
    "file/test-support",
    "dep:rcgen",
    "dep:expression",
]

# Every integration suite runs a node.
[[test]]
name = "ledger"
path = "tests/ledger/main.rs"
required-features = ["node"]

[[test]]
name = "plane"
path = "tests/plane/main.rs"
required-features = ["node"]

[[test]]
name = "running"
path = "tests/running/main.rs"
required-features = ["node"]

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false
required-features = ["node"]

# A Work Process unit as a node loads it: `examples/approval_unit.bpmn`
# generated by `process::generate`, built into the library a node opens
# through the C ABI, against this build's own `xmip-core-process`. Built by
# cargo test, which opens it from beside a node's configuration and turns
# it (`library.rs`; ADR-0056, amendment 2026-11-13).
[[example]]
name = "approval_unit"
path = "examples/approval_unit.rs"
crate-type = ["cdylib"]
required-features = ["dynamic-loading"]
