# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-runtime"
description = "The Xmip runtime: a node started from its configuration and the technologies its program links, the message path it runs, and the native library the operator surfaces load."

[lib]
path = "src/lib.rs"
# rlib for the estate, cdylib for the surfaces. ADR-0014: the xmip executable,
# the PowerShell module and the GUI are .NET and P/Invoke a C ABI, so there
# has to be a native library that exports xmip_operate_v1 for them to load.
# This is it.
crate-type = ["rlib", "cdylib"]

[lints.rust]
# deny, not forbid, because forbid cannot be lowered anywhere. The runtime's
# C boundary is one folder, src/ffi/ (ADR-0050, refined 2026-09-25): the
# operator's table and the exports of xmip_operate.h sections 5 to 11
# (ADR-0027, the boundary facing out), and the loader that opens somebody
# else's library and calls through its table (ADR-0057, the boundary facing
# in). Each file there allows unsafe at its top with its reason; nothing
# outside the folder may, and test/Unsafe.Test.ps1 holds it.
unsafe_code = "deny"

# What a remote surface needs — `abi`, `node`, `observe`, `net`, `tls`,
# `serde_json` and the local endpoint's connecting end — is always linked; every
# dependency marked optional is the running node's, and only the `node`
# feature turns it on (see [features]).
[dependencies]
serde ={ version = "1", features = ["derive"], optional = true }
# Section 10 hands an Xmip Application's routes and edits to the designer's
# language server as JSON, in memory only (ADR-0031 clause 2, ADR-0064).
serde_json = "1"
# Optional: only a node that loads modules links a loader, and only the
# dynamic-loading feature turns it on. The portable dlopen/LoadLibraryEx pair,
# nothing more — the flags specification section 3 requires are passed by
# ffi/loaded_module.rs, which does not take the crate's defaults on Windows.
libloading = { version = "0.8", optional = true }
abi = { package = "xmip-core-abi", git = "https://github.com/IlleNilsson/xmip-core-abi", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main", optional = true }
journey = { package = "xmip-core-journey", git = "https://github.com/IlleNilsson/xmip-core-journey", branch = "main", optional = true }
node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main" }
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main", optional = true }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main", optional = true }
party = { package = "xmip-core-party", git = "https://github.com/IlleNilsson/xmip-core-party", branch = "main", optional = true }
receive = { package = "xmip-core-receive", git = "https://github.com/IlleNilsson/xmip-core-receive", branch = "main", optional = true }
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main", optional = true }
# x509: who a surface is, the subject of the certificate it presented to
# the operate listener, read by the one reader of a name (plane::served).
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main", features = ["x509"], optional = true }
send = { package = "xmip-core-send", git = "https://github.com/IlleNilsson/xmip-core-send", branch = "main", optional = true }
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main", optional = true }
route = { package = "xmip-core-route", git = "https://github.com/IlleNilsson/xmip-core-route", branch = "main", optional = true }
# Section 9: a program's audit record, forwarded to the capability that owns
# it (ADR-0062). xaudit, as xcore, because the export's own file is ffi/audit.rs.
xaudit = { package = "xmip-core-audit", git = "https://github.com/IlleNilsson/xmip-core-audit", branch = "main" }
# Section 11: Events, subscribed from any language, forwarded to the event
# crate's process hub (ADR-0065). xevent, as xaudit, because the export's own
# file is ffi/event.rs.
xevent = { package = "xmip-core-event", git = "https://github.com/IlleNilsson/xmip-core-event", branch = "main", optional = true }
observe = { package = "xmip-core-observe", git = "https://github.com/IlleNilsson/xmip-core-observe", branch = "main" }
configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main", optional = true }
# The one transport trait: every Location's transport is built through it,
# once, from the technologies the program starting the node linked, and
# handed the guard the node terminates its receives' TLS with
# (`transport::Guard`, from `[provision.receive]`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["tls"], optional = true }
# The runtime store: where a paused Subscription's standing and the Messages
# it holds are kept, sealed, over whichever engine the program linked, so a
# pause survives a restart (ADR-0013, amendment 2026-09-30).
persist = { package = "xmip-core-persist", git = "https://github.com/IlleNilsson/xmip-core-persist", branch = "main", optional = true }
# The key home the runtime store's data key is wrapped in: the key store the
# node's `[store]` names, among those its program linked (ADR-0063 clause 4).
secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main", optional = true }
# The operate plane (ADR-0067; ADR-0014, amendment 2026-10-12): gRPC on
# the estate's own HTTP/2 and framing, inside Xmip's own mutual TLS.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main" }
# A person's certificate (ADR-0034, amendment 2026-10-15): the request a
# surface makes — the phone's build too — and, on a node's, the signing by
# the authority `[provision.operator]` names. The capability alone; the
# runtime links no technology of it.
provision = { package = "xmip-core-provision", git = "https://github.com/IlleNilsson/xmip-core-provision", branch = "main" }
# The private key a request is made with is overwritten when its answer is
# dropped.
zeroize = "1"
# A test authority and each end's certificate, for the operate plane's
# tests (`fixture::authority`): only the test-support feature turns it on.
rcgen = { version = "0.13", optional = true }
# The one byte cursor a loaded contract reads the content through.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }

# The local operate endpoint (`plane::local`; ADR-0014, amendment
# 2026-10-13): on Windows a named pipe, made, connected, read and written
# through these calls (`ffi::pipe`, `ffi::pipe_io`), its security descriptor
# written from SDDL; opened as a client lent for identification alone, a
# read ended from another thread, the connecting account and the identifier
# of an account `[operate] admit` names (open problem 35). Until 2026-10-21
# through the `interprocess` pipe library, whose stream opened a handle
# again behind its caller. And a directory watch (`directory_watch`): a
# change notification and the event that ends its wait.
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# On Unix a Unix domain socket: the connecting user by the kernel's word,
# its name, and the group a shared socket belongs to. Only the node's side
# asks who connected, so only `node`
# links it; a remote build connects with the standard library alone, and
# the phone's (iOS) never compiles `nix`'s socket module, which names
# macOS-only constants on every Apple target. A directory watch
# (`directory_watch`) waits on inotify on Linux and kqueue elsewhere,
# through `nix`'s safe calls.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket", "user", "inotify", "event", "poll"], optional = true }

[dev-dependencies]
# This crate with its `test-support`, so the integration tests (tests/) take
# the same fixtures its unit tests do. Without the default features, so a
# remote build's tests stay a remote build (`--no-default-features
# --features remote`).
xmip-core-runtime = { path = ".", default-features = false, features = ["test-support"] }
# The latency tests' figures, the plain wake they are held beside and Xmip's
# own processor time (`xcore::latency`, `xcore::processor_time`).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main", features = ["test-support"] }
# The test cluster's names, from its `xmip.toml` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main", features = ["test-support"] }
# A loopback address no one holds, for a node a test starts to bind
# (`net::fixture::unheld`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", features = ["test-support"] }
# A runtime store in memory, sealed under a key held in memory, so a test
# stops and starts a node over the same records without a machine's key store.
persist = { package = "xmip-core-persist", git = "https://github.com/IlleNilsson/xmip-core-persist", branch = "main", features = ["test-support"] }
secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main", features = ["test-support"] }
# One real route technology, so a test proves arrival reads a prefixed
# property through what a node loads rather than through a stand-in.
route-party = { package = "xmip-core-route-party", git = "https://github.com/IlleNilsson/xmip-core-route-party", branch = "main" }
# The tests write a Subscription's filter as the expression it is (ADR-0066).
path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main" }
# One real transport with a loopback far end, so a test starts a node that
# receives and sends over it rather than over a stand-in; with TLS, so a
# test proves a Party's certificate through a node's real gates.
tcp = { package = "xmip-core-transport-tcp", git = "https://github.com/IlleNilsson/xmip-core-transport-tcp", branch = "main", features = ["tls"] }
# And one whose connections are kept, for a test that carries hundreds of
# Messages through a node: raw TCP spends a connection a Message, its
# sender's side waiting minutes to close (ADR-0018, amendment 2026-10-21).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# The test Storage node (the owner, 2026-10-01: *for testing purposes the
# Xmip Nodes of Storage type can use SQLite in memory for administration and
# RocksDB for runtime*), so the receive path is proved, timed and killed
# over the engines a node keeps the Ledger in.
rocksdb = { package = "xmip-core-persist-rocksdb", git = "https://github.com/IlleNilsson/xmip-core-persist-rocksdb", branch = "main" }
sqlite = { package = "xmip-core-persist-sqlite", git = "https://github.com/IlleNilsson/xmip-core-persist-sqlite", branch = "main" }

# The platform's key store, so a test that kills a process holding the
# Ledger reopens it under the same data key (ADR-0063 clause 4).
[target.'cfg(windows)'.dev-dependencies]
secret-dpapi = { package = "xmip-core-secret-dpapi", git = "https://github.com/IlleNilsson/xmip-core-secret-dpapi", branch = "main" }

[target.'cfg(unix)'.dev-dependencies]
secret-file = { package = "xmip-core-secret-file", git = "https://github.com/IlleNilsson/xmip-core-secret-file", branch = "main" }

[features]
# A node and every surface on a machine that runs one.
default = ["node"]
# The running node: its start and its message path (`running`, `arrival`,
# `send_step`, the Ledger, Xmip Storage), the service and its registration,
# the runtime store (`persist`) and its key home (`secret`), the transports
# a program links, and the node's side of the operate plane — the operate
# listener and its board (`plane::listener`, `plane::served`), with
# `xmip_operate.h` sections 1, 5, 6 and 10 to 16, section 17's serve
# exports, section 19's signing (`xmip_operator_sign_v1`, by the authority
# `[provision.operator]` names) and section 21, a host's listener in Xmip's
# own protection and the certificate an authority issues it
# (`secure_listener`). Everything a remote surface has, too.
node = [
    "remote",
    "dep:serde",
    "dep:context",
    "dep:journey",
    "dep:message",
    "dep:stream",
    "dep:party",
    "dep:receive",
    "dep:identify",
    "dep:authenticate",
    "dep:send",
    "dep:authorize",
    "dep:route",
    "dep:xevent",
    "dep:configure",
    "dep:transport",
    "dep:persist",
    "dep:secret",
    "dep:codec",
    "dep:nix",
]
# A surface that follows nodes on other machines and runs none, the phone
# (ADR-0014, amendment 2026-10-14): `plane::remote` and the operate plane's
# call, local endpoint and role it stands on, with `xmip_operate.h` section
# 7 (the rules), section 8 (a publication read), section 9 (a program's audit
# record), section 18 (the role and the gate), section 17's client exports
# (`xmip_remote_*`, the kept open too) and section 19's request
# (`xmip_operator_request_v1`, a person's key and request, and its two
# halves around a keeper's signature, `xmip_operator_information_v1` and
# `xmip_operator_assemble_v1`, and the chain and anchors kept whole,
# `xmip_operator_keep_v1`). Built alone with
# `--no-default-features --features remote`.
remote = []
# ffi/loaded_module.rs, ffi/loaded_contract.rs and what library.rs opens with
# them are guarded on this.
# Declared so the cfg is a real switch rather than a condition that is
# silently always false.
dynamic-loading = ["node", "dep:libloading"]
# The gates' stand-ins the runtime's tests run a node with (`fixture`),
# placed once for its unit tests and its integration tests. Enabled only by
# the dev-dependency on this crate below, so never in a production build.
# It names its nodes from the test cluster's `xmip.toml` (`configure::fixture`).
test-support = ["configure?/test-support", "dep:rcgen"]

# Both integration suites run a node.
[[test]]
name = "ledger"
path = "tests/ledger/main.rs"
required-features = ["node"]

[[test]]
name = "plane"
path = "tests/plane/main.rs"
required-features = ["node"]

[profile.dev.package."*"]
opt-level = 3
